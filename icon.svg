<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PeerKit">
	<!-- Four devices in a room, every one linked straight to every other (no server in the middle); this device glows at the centre. -->
	<defs>
		<radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
			<stop offset="0" stop-color="#1f2a40"/>
			<stop offset="1" stop-color="#0c0f16"/>
		</radialGradient>
		<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#4f8bff" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#4f8bff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="left" x1="32" y1="11" x2="13" y2="44" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#22d3ee"/>
			<stop offset="1" stop-color="#a78bfa"/>
		</linearGradient>
		<linearGradient id="right" x1="32" y1="11" x2="51" y2="44" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#22d3ee"/>
			<stop offset="1" stop-color="#34d399"/>
		</linearGradient>
		<linearGradient id="base" x1="13" y1="44" x2="51" y2="44" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#a78bfa"/>
			<stop offset="1" stop-color="#34d399"/>
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="url(#bg)"/>
	<rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
	<!-- the room -->
	<circle cx="32" cy="33" r="22" fill="none" stroke="#4f8bff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>
	<!-- the links -->
	<g fill="none" stroke-width="2.5" stroke-linecap="round">
		<path d="M32 11 13 44" stroke="url(#left)"/>
		<path d="M32 11 51 44" stroke="url(#right)"/>
		<path d="M13 44H51" stroke="url(#base)"/>
		<g stroke="#4f8bff" stroke-opacity="0.85" stroke-width="2">
			<path d="M32 33V11"/>
			<path d="M32 33 13 44"/>
			<path d="M32 33 51 44"/>
		</g>
	</g>
	<!-- data on its way -->
	<g fill="#ffffff">
		<circle cx="22.5" cy="27.5" r="1.3"/>
		<circle cx="41.5" cy="27.5" r="1.3"/>
		<circle cx="32" cy="44" r="1.3"/>
	</g>
	<!-- this device -->
	<circle cx="32" cy="33" r="12" fill="url(#halo)"/>
	<circle cx="32" cy="33" r="5.5" fill="#4f8bff" stroke="#0c0f16" stroke-width="1.5"/>
	<circle cx="32" cy="33" r="2" fill="#ffffff"/>
	<!-- the others -->
	<g stroke="#0c0f16" stroke-width="1.5">
		<circle cx="32" cy="11" r="6.5" fill="#22d3ee"/>
		<circle cx="13" cy="44" r="6.5" fill="#a78bfa"/>
		<circle cx="51" cy="44" r="6.5" fill="#34d399"/>
	</g>
	<g fill="#0c0f16" fill-opacity="0.35">
		<circle cx="32" cy="11" r="2.5"/>
		<circle cx="13" cy="44" r="2.5"/>
		<circle cx="51" cy="44" r="2.5"/>
	</g>
</svg>
