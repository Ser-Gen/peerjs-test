<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
	<meta name="theme-color" content="#181c23" media="(prefers-color-scheme: dark)">
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<title>PeerKit</title>
	<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
	<link rel="icon" href="icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="stylesheet" href="app/ui/styles.css">
</head>
<body>
	<div class="app">
		<header class="topbar">
			<div class="brand">PeerKit</div>
			<div id="status" class="status" data-state="idle" hidden>
				<span class="dot" aria-hidden="true"></span>
				<span id="status-text"></span>
				<span id="rtt" class="rtt" title="Round-trip time" hidden></span>
				<span id="route" class="route" hidden></span>
			</div>
			<button id="open-settings" class="icon-btn" type="button" aria-label="Settings" aria-pressed="false"></button>
			<button id="leave" class="btn ghost small" type="button" hidden>Leave</button>
		</header>

		<div id="banner" class="banner" role="status" hidden>
			<span id="banner-text"></span>
			<button id="banner-action" class="btn small" type="button" hidden></button>
		</div>

		<div id="notice" class="notice" role="status" hidden>
			<span id="notice-text"></span>
			<button id="notice-save" class="btn small primary" type="button">Save server</button>
			<button id="notice-dismiss" class="icon-btn small" type="button" aria-label="Dismiss"></button>
		</div>

		<main>
			<section id="view-start" class="view start-view" hidden>
				<div id="start-root" class="start-inner"></div>
				<details class="legacy">
					<summary>Old demos</summary>
					<p>
						<a href="demos/ping/">ping</a> ·
						<a href="demos/share/">share</a> ·
						<a href="demos/screen/">screen</a> ·
						<a href="demos/webcam/">webcam</a> ·
						<a href="demos/recorder/">recorder</a> ·
						<a href="demos/gyro/">gyro</a> ·
						<a href="demos/gamepad/">gamepad</a>
					</p>
				</details>
			</section>

			<section id="view-message" class="view message" hidden>
				<div id="msg-spinner" class="spinner" aria-hidden="true"></div>
				<h1 id="msg-title"></h1>
				<p id="msg-text" class="hint"></p>
				<p id="msg-server" class="server-line" hidden></p>
				<div id="msg-actions" class="actions"></div>
			</section>

			<section id="view-session" class="view session" hidden>
				<div id="room-bar" class="room-bar"></div>
				<div id="tool-host" class="tool-host"></div>
			</section>

			<section id="view-settings" class="view settings" hidden></section>
		</main>

		<nav id="tabs" class="tabs" hidden></nav>
	</div>

	<div id="toasts" class="toasts" aria-live="polite"></div>

	<noscript>PeerKit needs JavaScript.</noscript>
	<script src="vendor/peerjs.min.js"></script>
	<script src="vendor/qrcode.js"></script>
	<script type="module" src="app/main.js"></script>
</body>
</html>
